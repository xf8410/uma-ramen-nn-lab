name: EXP-006c 智力体力豁免 × 副属性折扣矩阵（9 变体 × 4200 局，同流配对）

on:
  workflow_dispatch:

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: 43f532c599d8591f16b1fcdd2e301ebff858d511

jobs:
  # 9 变体并行；每变体 525 计划 × 8 局 = 4200 局；同一 seed 流 → 与 base 逐局配对
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [base, capd0, capd50, wisf0, wisf20, wisf32, wisf0-capd0, wisf20-capd0, wisf32-capd50]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Verify upstream pin
        run: |
          GOT=$(git rev-parse HEAD)
          grep -q "$GOT" lab/experiments/UPSTREAM.md || { echo "PIN_MISMATCH: $GOT"; exit 1; }
      - name: Apply EXP-006c patch
        run: python3 lab/experiments/EXP-006-wisdom-vital/patch_exp006c.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp006c-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp006c-${{ runner.os }}-
            lab-exp-${{ runner.os }}-
      - name: Download gamedata
        run: |
          if [ ! -f gamedata/constants.json ]; then
            mkdir -p gamedata
            BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
            for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
              curl -sSL --retry 5 --retry-delay 5 --retry-all-errors "$BASE/$f" -o "gamedata/$f" || exit 1
            done
          fi
      - name: Build bench
        run: cargo build --release -p umasim --bin ramen_space_bench
      - name: Run bench (variant=${{ matrix.variant }})
        run: |
          mkdir -p experiment_output
          ./target/release/ramen_space_bench --trainer handwritten \
            --variant ${{ matrix.variant }} \
            --runs-per-plan 8 --seed 61444 \
            --csv experiment_output/exp006c_${{ matrix.variant }}.csv 2>&1 | tail -45
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-006c-${{ matrix.variant }}
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  summary:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-006c-*
          path: downloaded
          merge-multiple: false
      - name: 配对裁决（base 保真 + t>2 且 Δ>0 才采纳）
        run: |
          python3 - <<'PY'
          import csv, glob, math, os

          VARIANTS = ["base", "capd0", "capd50", "wisf0", "wisf20", "wisf32",
                      "wisf0-capd0", "wisf20-capd0", "wisf32-capd50"]

          def load(v):
              hits = glob.glob(f"downloaded/EXP-006c-{v}/**/exp006c_{v}.csv", recursive=True)
              assert hits, f"缺 {v} 的 CSV"
              return list(csv.DictReader(open(hits[0], newline="")))

          base = load("base")
          n = len(base)
          b_scores = [float(r["score"]) for r in base]
          b_mean = sum(b_scores) / n
          b_se = (sum((x - b_mean) ** 2 for x in b_scores) / (n - 1)) ** 0.5 / math.sqrt(n)
          seeds = [r["seed"] for r in base]

          # 基线保真：base 必须复现 pin 手写 65438.2 ± 54.5（否则补丁动了基线，全矩阵作废）
          PIN, PIN_SE = 65438.2, 54.5
          print(f"base: n={n} mean={b_mean:.1f} se={b_se:.1f}  | pin 复测 {PIN}±{PIN_SE}  偏差 {b_mean-PIN:+.1f}")
          assert abs(b_mean - PIN) < 4 * PIN_SE, f"BASE DRIFT: {b_mean} vs {PIN}——补丁动了基线，作废"

          print(f"\n{'变体':<14} {'均分':>8} {'Δ配对':>8} {'t':>7} {'训练PT':>7} {'RMJ大成功':>8} {'智均':>5} {'自选未达':>6}  判定")
          rows_out = []
          for v in VARIANTS:
              rows = base if v == "base" else load(v)
              assert [r["seed"] for r in rows] == seeds, f"{v}: seed 流不一致，配对失效"
              s = [float(r["score"]) for r in rows]
              diffs = [a - b for a, b in zip(s, b_scores)]
              d = sum(diffs) / n
              sd = (sum((x - d) ** 2 for x in diffs) / (n - 1)) ** 0.5
              t = d / (sd / math.sqrt(n)) if sd > 0 else 0.0
              pt = sum(int(r["skill_pt"]) for r in rows) / n
              rmj = sum(int(r["rmj_ok"]) for r in rows) / n
              wis = sum(int(r["wisdom"]) for r in rows) / n
              fail = sum(r["free_race_ok"] == "0" for r in rows)
              m = sum(s) / n
              verdict = "（对照）" if v == "base" else ("采纳 ✅" if (t > 2 and d > 0) else "未超")
              print(f"{v:<14} {m:>8.1f} {d:>+8.1f} {t:>+7.2f} {pt:>7.0f} {rmj:>8.2f} {wis:>5.0f} {fail:>6}  {verdict}")
              rows_out.append((v, m, d, t, pt, rmj, fail, verdict))

          winners = [r for r in rows_out if r[7] == "采纳 ✅"]
          print(f"\n采纳数：{len(winners)}/{len(VARIANTS)-1}")
          if winners:
              best = max(winners, key=lambda r: r[2])
              print(f"最优候选：{best[0]}（Δ={best[2]:+.1f}, t={best[3]:+.2f}）→ 建议下一轮对它做细扫")
          with open("SUMMARY.txt", "w") as f:
              f.write(f"base mean={b_mean:.1f}\n")
              for r in rows_out:
                  f.write(f"{r[0]}: mean={r[1]:.1f} d={r[2]:+.1f} t={r[3]:+.2f} pt={r[4]:.0f} rmj={r[5]:.2f} fail={r[6]} {r[7]}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-006c-summary
          path: SUMMARY.txt
          retention-days: 30
