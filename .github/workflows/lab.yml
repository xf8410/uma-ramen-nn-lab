name: lab-check

on:
  push:
    branches: [main, "workbench/**"]
  pull_request:
  schedule:
    # 每周六 03:00 UTC（准则 §4：周末定时补采+重训+验收）
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      experiment:
        description: "实验 ID（如 EXP-001a）；空 = 只跑冒烟"
        required: false
        default: ""

env:
  # 上游 pin 白名单（experiments/UPSTREAM.md）——改 pin 必须先改那里并走账本
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: 43f532c599d8591f16b1fcdd2e301ebff858d511

jobs:
  smoke:
    # 准则 §1 三步验证第 1 步：任何实验先冒烟
    # 门禁 = 编译 + Python 测试 + CLI 入口；验收口径是闭环基准（准则 §0.1）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - uses: actions/checkout@v4
        with:
          path: lab

      - name: Collect lab docs for artifact
        run: mkdir -p lab_docs && cp lab/PRINCIPLES.md lab/README.md lab_docs/ && cp -r lab/experiments lab_docs/

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lab-smoke-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 上游 requirements.txt 不含 pytest（实测 9677b2a9 卡此）；
      # torch 显式走 CPU index——免费 runner 无 GPU，模型也用不上 CUDA
      - name: Install python deps
        run: |
          pip install pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/ramen_nn/requirements.txt

      - name: Download gamedata (best effort)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || echo "WARN: $f"
          done
          ls -la gamedata/

      - name: Cargo check (default)
        run: cargo check -p umasim
      - name: Cargo check (onnx feature)
        run: cargo check -p umasim --features onnx
      - name: Cargo build bins (release)
        run: cargo build --release -p umasim --bins

      - name: Python tests
        run: python -m pytest scripts/ramen_nn/tests -q

      - name: Bench CLI 入口冒烟 (准则 §1.1)
        run: ./target/release/ramen_space_bench --help

      - name: Record CLI arg surface (供 plan.md 回填精确参数)
        run: |
          for b in ramen_teacher_collect ramen_export_npy ramen_space_bench ramen_advantage_probe ramen_handwritten_choice; do
            echo "=== $b --help ==="
            ./target/release/$b --help || true
          done > cli_args.txt
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            lab_docs
            cli_args.txt
          retention-days: 14

  # 上游 Rust 全套测试：信息性，不进门禁（实测 2 处坑：逐位断言绑上游本地
  # gamedata 会因数据漂移假红；debug profile 330 整局测试超冒烟窗）
  upstream-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-suite-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lab-suite-${{ runner.os }}-
      - name: Download gamedata (best effort)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || echo "WARN: $f"
          done
      - name: Full test suite (informational)
        run: cargo test -p umasim --lib 2>&1 | tail -100

  # 正式实验 job：dispatch 带 experiment ID，执行该实验目录下的 run.sh
  # （准则 §3：先写 plan 再跑；run.sh 是实验自己的协议，CI 不硬编码任何实验）
  experiment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.experiment != ''
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - uses: actions/checkout@v4
        with:
          path: lab

      - name: Verify upstream pin (准则 §0.5 / UPSTREAM.md)
        run: |
          GOT=$(git rev-parse HEAD)
          echo "checked out $GOT"
          grep -q "$GOT" lab/experiments/UPSTREAM.md || { echo "PIN_MISMATCH: $GOT 不在 UPSTREAM.md 白名单"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp-${{ runner.os }}-
            lab-smoke-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install python deps
        run: |
          pip install pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/ramen_nn/requirements.txt

      - name: Download gamedata (必需)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || exit 1
          done

      - name: Run experiment script
        run: bash "lab/experiments/${{ github.event.inputs.experiment }}/run.sh"

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.experiment }}-artifacts
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error
