name: lab-check

on:
  push:
    branches: [main, "workbench/**"]
  pull_request:
  schedule:
    # 每周六 03:00 UTC（准则 §4：周末定时补采+重训+验收）
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      experiment:
        description: "实验 ID（如 EXP-001）；空 = 只跑冒烟"
        required: false
        default: ""

jobs:
  smoke:
    # 准则 §1 三步验证第 1 步：任何实验先冒烟
    # 门禁 = 编译 + Python 测试 + CLI 入口。上游 Rust 全套测试不进门禁（见
    # upstream-suite job 注释），我们的验收是闭环基准（准则 §0.1）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muxueliunian/umaai-rs-muxue
          ref: feat/ramen-nn-schema

      - uses: actions/checkout@v4
        with:
          path: lab

      - name: Collect lab docs for artifact
        run: mkdir -p lab_docs && cp lab/PRINCIPLES.md lab/README.md lab_docs/ && cp -r lab/experiments lab_docs/

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lab-smoke-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install python deps
        run: pip install -r scripts/ramen_nn/requirements.txt

      # gamedata 下载（主仓 build.yml 实证源：xulai1001/umaai-rs master raw）。
      # 上游仓 gamedata 不入库；EXP-001 起 CI 需要跑闭环基准时才强依赖它——
      # 冒烟只要求编译与 Python 测试，下载失败不拦门禁
      - name: Download gamedata (best effort)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || echo "WARN: $f"
          done
          ls -la gamedata/

      - name: Cargo check (default)
        run: cargo check -p umasim
      - name: Cargo check (onnx feature)
        run: cargo check -p umasim --features onnx
      - name: Cargo build bins (release)
        run: cargo build --release -p umasim --bins

      - name: Python tests
        run: python -m pytest scripts/ramen_nn/tests -q

      - name: Bench CLI 入口冒烟 (准则 §1.1)
        run: ./target/release/ramen_space_bench --help

      - name: Record CLI arg surface (供 plan.md 回填精确参数)
        run: |
          for b in ramen_teacher_collect ramen_export_npy ramen_space_bench ramen_advantage_probe ramen_handwritten_choice; do
            echo "=== $b --help ==="
            ./target/release/$b --help || true
          done > cli_args.txt
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            lab_docs
            cli_args.txt
          retention-days: 14

  # 上游 Rust 全套测试：信息性，不进门禁（首次 CI 实锤 2 处坑：
  # ① 测试断言精确基线值，绑定上游本地 gamedata——我们拉 master raw gamedata
  #   会因数据漂移假红；② debug profile 跑 330 个整局测试，60min 冒烟窗放不下）。
  # 我们的质量门禁是闭环基准（准则 §0.1），不是上游测试套件。
  upstream-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muxueliunian/umaai-rs-muxue
          ref: feat/ramen-nn-schema
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-suite-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lab-suite-${{ runner.os }}-
      - name: Download gamedata (best effort)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || echo "WARN: $f"
          done
      - name: Full test suite (informational)
        run: cargo test -p umasim --lib -- 2>&1 | tail -100

  # 正式实验 job：workflow_dispatch 带 experiment ID 触发，准则 §4 时限 6h
  experiment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.experiment != ''
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muxueliunian/umaai-rs-muxue
          ref: feat/ramen-nn-schema
      - uses: actions/checkout@v4
        with:
          path: lab

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp-${{ runner.os }}-
            lab-smoke-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r scripts/ramen_nn/requirements.txt

      - name: Download gamedata (必需)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || exit 1
          done

      # 教师数据采集 → 导出 → 标签 → 训练 → ONNX 导出
      # 精确参数以 experiments/<ID>/plan.md 为准（准则 §3 先写后跑）；
      # smoke job 的 cli_args.txt artifact 是参数回填源
      - name: Collect teacher data (配额补稀疏阶段, 准则 §2)
        run: |
          cargo run --release -p umasim --bin ramen_teacher_collect -- \
            --count 200 --start 0 --out training_data/ci_run || echo "COLLECT_PARAMS_NEED_PLAN_MD"
      - name: Export npy (禁 --raw, 准则 §1.2)
        run: cargo run --release -p umasim --bin ramen_export_npy -- --input training_data/ci_run --output training_data/npy_ci
      - name: Labels
        run: python scripts/ramen_nn/labels.py --input training_data/npy_ci --output training_data/labels_ci
      - name: Train (嵌套抽稀断点续训, 准则 §4)
        run: python scripts/ramen_nn/train.py --data training_data/npy_ci --labels training_data/labels_ci --output-dir saved_models/ci
      - name: Export ONNX (opset13 + 白名单 + 对拍 <1e-4, 准则 §4)
        run: python scripts/ramen_nn/export_onnx.py --checkpoint saved_models/ci/best.pt --output saved_models/ci/model.onnx

      # 实验产物：只保留 model.onnx + 元数据 + 指标（准则 §4），.npy 用完即弃
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.experiment }}-artifacts
          path: |
            saved_models/ci/model.onnx
            saved_models/ci/model.onnx.json
            saved_models/ci/run.json
            saved_models/ci/metrics.jsonl
          retention-days: 14
