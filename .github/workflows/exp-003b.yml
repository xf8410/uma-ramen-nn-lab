name: EXP-003b 劣化排查（search_n 剂量对照矩阵）

on:
  workflow_dispatch:

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: 43f532c599d8591f16b1fcdd2e301ebff858d511
  EXP003_RUN_ID: "33588447596"

jobs:
  # 线 1：标签统计对拍（零采集成本）——labels.json vs DESIGN 公布的 pilot 数值
  label-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EXP-003-npy-labels
          path: downloaded
          repository: ${{ github.repository }}
          run-id: ${{ env.EXP003_RUN_ID }}
          github-token: ${{ github.token }}
      - name: 对拍统计
        run: |
          python3 - <<'PY'
          import json, glob, os

          lpath = glob.glob("downloaded/**/labels_v1/labels.json", recursive=True)[0]
          mpath = glob.glob("downloaded/**/npy_v1/meta.json", recursive=True)[0]
          labels = json.load(open(lpath)); meta = json.load(open(mpath))
          print("== 本次（sn=8, 11837 条）==")
          print("rollouts(search_n) =", meta["search_n"], " plan_count =", meta["plan_count"])
          print(json.dumps(labels["stages"], ensure_ascii=False, indent=2))
          print("value_mean =", [round(v, 2) for v in labels["value_mean"]])
          print("value_stdev =", [round(v, 2) for v in labels["value_stdev"]])
          print("\n== DESIGN §3 公布的 pilot（11957 条）归一化常数 ==")
          print("center ≈ [60988.10, 2140.95, 62465.22]")
          print("scale  ≈ [ 4244.10,  791.90, 4678.82]")
          print("\n== 判读 ==")
          stab = {k: v["selector_stability_mean"] for k, v in labels["stages"].items()}
          ent = {k: v["policy_entropy_mean"] for k, v in labels["stages"].items()}
          print("selector_stability（DESIGN: CRN 留一稳定率约 0.99）:", {k: round(v, 3) for k, v in stab.items()})
          print("policy_entropy（越低越接近 one-hot）:", {k: round(v, 3) for k, v in ent.items()})
          out = {"stages": labels["stages"], "value_mean": labels["value_mean"], "value_stdev": labels["value_stdev"], "search_n": meta["search_n"]}
          open("labelstats.json", "w").write(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-003b-labelstats
          path: labelstats.json
          retention-days: 30

  # 线 2：扁平矩阵 3 组 search_n × 8 分片 = 24 个采集 job（同 [0,3000) 区间）
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sn: 8,  shard: 0 }
          - { sn: 8,  shard: 1 }
          - { sn: 8,  shard: 2 }
          - { sn: 8,  shard: 3 }
          - { sn: 8,  shard: 4 }
          - { sn: 8,  shard: 5 }
          - { sn: 8,  shard: 6 }
          - { sn: 8,  shard: 7 }
          - { sn: 32, shard: 0 }
          - { sn: 32, shard: 1 }
          - { sn: 32, shard: 2 }
          - { sn: 32, shard: 3 }
          - { sn: 32, shard: 4 }
          - { sn: 32, shard: 5 }
          - { sn: 32, shard: 6 }
          - { sn: 32, shard: 7 }
          - { sn: 64, shard: 0 }
          - { sn: 64, shard: 1 }
          - { sn: 64, shard: 2 }
          - { sn: 64, shard: 3 }
          - { sn: 64, shard: 4 }
          - { sn: 64, shard: 5 }
          - { sn: 64, shard: 6 }
          - { sn: 64, shard: 7 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Verify upstream pin
        run: |
          GOT=$(git rev-parse HEAD)
          grep -q "$GOT" lab/experiments/UPSTREAM.md || { echo "PIN_MISMATCH: $GOT"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp-${{ runner.os }}-
            lab-smoke-${{ runner.os }}-
      - name: Download gamedata (必需)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || exit 1
          done
      - name: Collect sn=${{ matrix.sn }} shard=${{ matrix.shard }}
        run: bash "lab/experiments/EXP-003b-degrade-investigation/run.sh" ${{ matrix.shard }} ${{ matrix.sn }}
      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-003b-sn${{ matrix.sn }}-shard${{ matrix.shard }}
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  # 合并 3 组数据 + 逐组导出 npy(--raw) + 生成标签
  assemble-convert:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp-${{ runner.os }}-
            lab-smoke-${{ runner.os }}-
      - name: Download gamedata (必需)
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || exit 1
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-003b-sn*-shard*
          path: downloaded
          merge-multiple: false
      - name: 按 sn 分组合并
        run: |
          python3 - <<'PY'
          import json, glob, os, shutil

          for sn in (8, 32, 64):
              manifests = []
              for shard in range(8):
                  hits = glob.glob(f"downloaded/EXP-003b-sn{sn}-shard{shard}/**/part_000000.bin", recursive=True)
                  assert hits, f"sn{sn} shard{shard} part 未找到"
                  ddir = os.path.dirname(hits[0])
                  m = json.load(open(os.path.join(ddir, "manifest.json")))
                  m["_dir"] = ddir
                  manifests.append(m)
              base = manifests[0]
              assert base["search_n"] == sn, f"sn{sn} manifest search_n={base['search_n']}"
              total = 0
              os.makedirs(f"merged_sn{sn}", exist_ok=True)
              parts, gidx = [], 0
              for i, m in enumerate(manifests):
                  s, e = i * 375, (i + 1) * 375
                  assert m["index_start"] == s and m["index_end"] == e, f"sn{sn} shard{i} 区间错"
                  assert m["finished_at"], f"sn{sn} shard{i} 未完成"
                  assert m["recipe_hash_fnv1a64"] == base["recipe_hash_fnv1a64"], f"sn{sn} shard{i} 配方不一致"
                  for p in m["parts"]:
                      shutil.copy(os.path.join(m["_dir"], p["name"]), f"merged_sn{sn}/part_{gidx:06d}.bin")
                      parts.append({**p, "name": f"part_{gidx:06d}.bin"})
                      gidx += 1
                  total += m["accepted"]
              merged = {**base, "index_start": 0, "index_end": 3000, "parts": parts, "accepted": total,
                        "skipped_uncaptured": sum(m["skipped_uncaptured"] for m in manifests),
                        "note": f"merged 8 shards (EXP-003b sn={sn})"}
              merged.pop("_dir", None)
              json.dump(merged, open(f"merged_sn{sn}/manifest.json", "w"), ensure_ascii=False, indent=2)
              print(f"sn{sn}: accepted={total} parts={gidx}")
          PY
      - name: Build ramen_export_npy
        run: cargo build --release -p umasim --bin ramen_export_npy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - name: Export + labels ×3 组
        run: |
          set -e
          for SN in 8 32 64; do
            echo "=== sn=$SN 导出 ==="
            ./target/release/ramen_export_npy --input "merged_sn$SN" --output-dir "npy_sn$SN" --raw 2>&1 | tail -8
            echo "=== sn=$SN 标签 ==="
            python3 scripts/ramen_nn/labels.py --input "npy_sn$SN" --output "labels_sn$SN" 2>&1 | tail -8
          done
      - name: Upload npy + labels ×3
        uses: actions/upload-artifact@v4
        with:
          name: EXP-003b-npy-labels
          path: |
            npy_sn8
            labels_sn8
            npy_sn32
            labels_sn32
            npy_sn64
            labels_sn64
          retention-days: 30
          if-no-files-found: error

  # 训练矩阵：3 组 sn × 2 种子 = 6 job
  train:
    needs: assemble-convert
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sn: 8,  seed: "20260830" }
          - { sn: 8,  seed: "20260831" }
          - { sn: 32, seed: "20260830" }
          - { sn: 32, seed: "20260831" }
          - { sn: 64, seed: "20260830" }
          - { sn: 64, seed: "20260831" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - name: Download npy + labels
        uses: actions/download-artifact@v4
        with:
          name: EXP-003b-npy-labels
          path: training_data
      - name: Train sn=${{ matrix.sn }} seed=${{ matrix.seed }}
        run: |
          python3 scripts/ramen_nn/train.py \
            --data training_data/npy_sn${{ matrix.sn }} \
            --labels training_data/labels_sn${{ matrix.sn }} \
            --output-dir saved_models/sn${{ matrix.sn }}-seed${{ matrix.seed }} \
            --seed ${{ matrix.seed }} \
            --device cpu \
            --epochs 200
      - name: Export ONNX
        run: |
          python3 scripts/ramen_nn/export_onnx.py \
            --checkpoint saved_models/sn${{ matrix.sn }}-seed${{ matrix.seed }}/best.pt \
            --output saved_models/sn${{ matrix.sn }}-seed${{ matrix.seed }}/model.onnx
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-003b-model-sn${{ matrix.sn }}-seed${{ matrix.seed }}
          path: saved_models/sn${{ matrix.sn }}-seed${{ matrix.seed }}
          retention-days: 30
          if-no-files-found: error

  summary:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-003b-model-*
          path: downloaded
          merge-multiple: false
      - name: 剂量-响应汇总
        run: |
          python3 - <<'PY'
          import json, glob, os

          arms = {8: [], 32: [], 64: []}
          for d in sorted(glob.glob("downloaded/EXP-003b-model-*")):
              tag = os.path.basename(d)  # EXP-003b-model-sn{sn}-seed{seed}
              _, sn, seed = tag.replace("EXP-003b-model-", "").split("-")
              sn = int(sn.replace("sn", ""))
              mpath = f"{d}/metrics.jsonl"
              assert os.path.exists(mpath), f"{mpath} 缺失（实际: {sorted(os.listdir(d))[:8]}）"
              metrics = [json.loads(l) for l in open(mpath)]
              best = min(m["best_regret"] for m in metrics)
              arms[sn].append((seed, best, len(metrics)))
              print(f"sn{sn} seed{seed}: best_regret={best:.1f} ({len(metrics)} ep)")

          print()
          means = {}
          for sn, rows in arms.items():
              mean = sum(r[1] for r in rows) / len(rows)
              means[sn] = mean
              print(f"sn{sn}: mean best_regret = {mean:.1f}  (n=3000 条口径，组间才可比)")

          ref = means[8]
          drop32 = (ref - means[32]) / ref * 100
          drop64 = (ref - means[64]) / ref * 100
          print(f"\n相对 sn8 降幅: sn32 = {drop32:.1f}%  sn64 = {drop64:.1f}%")
          if drop64 > 10 or drop32 > 10:
              print("判定: H3b 成立（剂量效应 >10%，超出种子散布）→ 正式采集升 search_n")
          else:
              print("判定: H3b 不成立（剂量效应 ≤10%）→ 转查协议/分布/容量档")
          open("SUMMARY.txt", "w").write(
              "\n".join(f"sn{sn}: {m:.1f}" for sn, m in means.items())
              + f"\ndrop32={drop32:.1f}% drop64={drop64:.1f}%\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-003b-summary
          path: SUMMARY.txt
          retention-days: 30
