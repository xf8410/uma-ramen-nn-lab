name: EXP-003b 剂量-响应汇总（收档存档版）

# ⚠ 修复记录（2026-09-03，随 EXP-010 分支顺手处理）：
# 本文件在 EXP-003b 收档时被整文件误写，YAML 文件头（name/on/jobs）全部丢失，
# 导致此后每次 push 都出现 ".github/workflows/exp-003b.yml" named-run 秒失败红叉
# （"workflow file is not a valid YAML"，jobs=[]，无任何脚本执行、无算力成本）。
# 现按存档下来的汇总 step 原文重建最小合法骨架，并改为仅 workflow_dispatch 可触发。

on:
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-003b-model-*
          path: downloaded
          merge-multiple: false
      - name: 剂量-响应汇总
        run: |
          python3 - <<'PY'
          import json, glob, os, re

          arms = {8: [], 32: [], 64: []}
          for d in sorted(glob.glob("downloaded/EXP-003b-model-*")):
              tag = os.path.basename(d)  # EXP-003b-model-sn{sn}-seed{seed}
              m = re.fullmatch(r"EXP-003b-model-sn(\d+)-seed(\d+)", tag)
              assert m, f"artifact 名解析失败: {tag}（实际: {sorted(os.listdir(d))[:8] if os.path.isdir(d) else 'not dir'}）"
              sn, seed = int(m.group(1)), m.group(2)
              mpath = f"{d}/metrics.jsonl"
              assert os.path.exists(mpath), f"metrics.jsonl 缺失: {mpath}（实际: {sorted(os.listdir(d))[:8]}）"
              metrics = [json.loads(l) for l in open(mpath)]
              best = min(rec["best_regret"] for rec in metrics)
              arms[sn].append((seed, best, len(metrics)))
              print(f"sn{sn} seed{seed}: best_regret={best:.1f} ({len(metrics)} ep)")

          print()
          means = {}
          for sn, rows in arms.items():
              mean = sum(r[1] for r in rows) / len(rows)
              means[sn] = mean
              print(f"sn{sn}: mean best_regret = {mean:.1f}  (n=3000 条口径，组间才可比)")

          ref = means[8]
          drop32 = (ref - means[32]) / ref * 100
          drop64 = (ref - means[64]) / ref * 100
          print(f"\n相对 sn8 降幅: sn32 = {drop32:.1f}%  sn64 = {drop64:.1f}%")
          if drop64 > 10 or drop32 > 10:
              print("判定: H3b 成立（剂量效应 >10%，超出种子散布）→ 正式采集升 search_n")
          else:
              print("判定: H3b 不成立（剂量效应 ≤10%）→ 转查协议/分布/容量档")
          open("SUMMARY.txt", "w").write(
              "\n".join(f"sn{sn}: {m:.1f}" for sn, m in means.items())
              + f"\ndrop32={drop32:.1f}% drop64={drop64:.1f}%\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-003b-summary
          path: SUMMARY.txt
          retention-days: 30
          if-no-files-found: error
